name: Build Apple Music inspired Spotify appearance

on:
  workflow_dispatch:
  push:
    branches: [restore-0.22.0]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Get Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
          path: theos
          submodules: recursive

      - name: Install build tools
        run: brew install make dpkg ldid

      - name: Prepare pinned source and restoration
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, urllib.request, zipfile
          root = pathlib.Path('build-src').resolve()
          source = 'https://codeload.github.com/skopevoj/spoti.pw/zip/f0fd8efd996719b8cf70adb3553be5c687af6b8e'
          with zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(source, timeout=120).read())) as archive:
              for entry in archive.infolist():
                  parts = pathlib.PurePosixPath(entry.filename).parts[1:]
                  if not parts or entry.is_dir():
                      continue
                  path = root.joinpath(*parts)
                  path.resolve().relative_to(root)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.read(entry))
                  mode = (entry.external_attr >> 16) & 0o777
                  path.chmod(mode or 0o644)
          payload = base64.b64decode("""
