          AAAIAAAARF1KwyXW/hgAABRRAAAwAAAAAAAAAAAAAACkgabBAQB0d2Vhay9Tb3VyY2VzL1NoYXJlZC9MeXJpY3NTb3VyY2VzL1Nw
          aWN5THlyaWNzLm1QSwECFAMUAAAACAAAAERdNsRn3RQAAAASAAAACwAAAAAAAAAAAAAApIHy2gEAdmVyc2lvbi50eHRQSwUGAAAA
          ABsAGwDGCAAAL9sBAAAA
          """)
          assert hashlib.sha256(payload).hexdigest() == '93e6d0cecdd09270a01621b3576ba51e4eb53645a9b78fb18ef3849ef9d7c803', 'Restoration checksum failed'
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for entry in archive.infolist():
                  path = root.joinpath(*pathlib.PurePosixPath(entry.filename).parts)
                  path.resolve().relative_to(root)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.read(entry))
                  path.chmod((entry.external_attr >> 16) & 0o777 or 0o644)
          print('Prepared 0.22.0+restored2 with the original 2405 flags.')
          PY

      - name: Check SDK and source layers
        shell: bash
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          [ "${SDK_VERSION%%.*}" -ge 26 ] || { echo 'Requires iPhoneOS SDK 26 or newer'; exit 1; }
          sh build-src/scripts/check-layers.sh build-src/tweak/Sources

      - name: Test lyric timing and background upgrades
        run: sh build-src/harness/restored-sync/build.sh

      - name: Compile and package
        run: env -u MAKELEVEL gmake -C build-src/tweak clean package

      - name: Extract and check restored features
        shell: bash
        run: |
          mkdir -p result unpacked
          cp build-src/tweak/packages/*.deb result/
          dpkg-deb -x result/*.deb unpacked
          DYLIB=unpacked/Library/MobileSubstrate/DynamicLibraries/spotifyglass.dylib
          file "$DYLIB"
          xcrun nm -g "$DYLIB" > exported-symbols.txt
          grep -q '_SGPatchCustomize' exported-symbols.txt
          grep -q '_SGPatchBootstrap' exported-symbols.txt
          grep -q '_SGSpicyLyricsAsk' exported-symbols.txt
          grep -q '_SGAdsSettingsPage' exported-symbols.txt
          grep -q '_SGDSP' exported-symbols.txt
          grep -q '_SGLyricsMeaningsFor' exported-symbols.txt
          strings "$DYLIB" > binary-strings.txt
          grep -q 'Spoof Premium' binary-strings.txt
          grep -q 'Spicy Lyrics' binary-strings.txt
          grep -q 'https://api.spicylyrics.org/query' binary-strings.txt
          cp "$DYLIB" result/spotifyglass.dylib
          cp build-src/RESTORED-FEATURES.md result/
          cp build-src/plist/liquid-glass.plist result/
          shasum -a 256 result/*.deb result/*.dylib > result/SHA256SUMS.txt

      - name: Upload tweak and dylib
        uses: actions/upload-artifact@v5
        with:
          name: spotipw-0.22.0-restored2
          path: result/
          if-no-files-found: error
          retention-days: 7
